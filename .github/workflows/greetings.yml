name: Greetings

on: 
  # Use pull_request_target for security and access to GITHUB_TOKEN secrets
  pull_request_target:
    types: [opened]
  issues:
    types: [opened]

jobs:
  greeting:
    runs-on: ubuntu-latest
    permissions:
      # Explicitly grant write permissions
      issues: write
      pull-requests: write

    steps:
      - name: Greet First-Time Issue Opener
        if: github.event_name == 'issues'
        uses: actions/first-interaction@v1
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          issue-message: '👋 Hi @${{ github.event.issue.user.login }}! Thanks for opening your first issue! 🎉\nWe appreciate your contribution and will review it soon.'

      - name: Greet First-Time PR Contributor
        if: github.event_name == 'pull_request_target'
        uses: actions/first-interaction@v1
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          pr-message: '🚀 Hey @${{ github.event.pull_request.user.login }}! Thanks for submitting your first pull request! 🥳\nA maintainer will review it shortly. Welcome aboard!'
