name: Greetings

on: [pull_request_target, issues]

jobs:
  greeting:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write

    steps:
      - name: Greet first-time contributors
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const issue = context.payload.issue;
            const pr = context.payload.pull_request;
            const sender = context.payload.sender.login;

            // Check if it's an issue
            if (issue) {
              const { data: userIssues } = await github.rest.search.issuesAndPullRequests({
                q: `repo:${context.repo.owner}/${context.repo.repo} author:${sender} is:issue`
              });
              if (userIssues.total_count === 1) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  body: `👋 Hi @${sender}! Thanks for opening your first issue! 🎉\nWe appreciate your contribution and will review it soon.`
                });
              }
            }

            // Check if it's a pull request
            if (pr) {
              const { data: userPRs } = await github.rest.search.issuesAndPullRequests({
                q: `repo:${context.repo.owner}/${context.repo.repo} author:${sender} is:pr`
              });
              if (userPRs.total_count === 1) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: pr.number,
                  body: `🚀 Hey @${sender}! Thanks for submitting your first pull request! 🥳\nA maintainer will review it shortly. Welcome aboard!`
                });
              }
            }
